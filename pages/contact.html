<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova - Contact</title>
    <link rel="stylesheet" href="../css/contact.css">
</head>
<body>
    <header class="main-header">
        <div class="top-header">
            <div class="header-logo__content">
                <a href="../pages/home.html">
                    <img src="../images/logo/Nova-Games-logo-removebg-preview.png" class="header-img__logo" alt="Nova Games logo">
                </a>
                <h1 class="header-title__logo">Nova entertainment</h1>
            </div>

            <nav class="header-left__bar">
                <ul class="header-list__bar">
                    <li class="header-list__element"><a href="../pages/home.html">home</a></li>
                    <li class="header-list__element"><a href="../pages/catalog.html">products</a></li>
                    <li class="header-list__element"><a href="../pages/community.html">community</a></li>
                    <li class="header-list__element"><a href="../pages/contact.html">contact</a></li>
                </ul>
            </nav>

            <div class="header-top__right">
                <nav class="header-right__nav">
                    <ul class="header-list__bar">
                        <li class="header-list__element"><a href="../pages/register.html">register</a></li>
                        <li class="header-list__element"><a href="../pages/login.html">sign in</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="contact-main">
        <form class="contact-form">
            <div class="contact-form__info">
                <h2 class="contact-form__title">Contact Nova</h2>
                <p class="contact-form__description">Send us your message and we will get back to you.</p>
            </div>

            <div class="contact-form__field">
                <label for="contact-name" class="contact-form__label">Name</label>
                <input type="text" id="contact-name" name="contact-name" class="contact-form__input" maxlength="100" required>
            </div>

            <div class="contact-form__field">
                <label for="contact-email" class="contact-form__label">Email</label>
                <input type="email" id="contact-email" name="contact-email" class="contact-form__input" maxlength="100" required>
            </div>

             <div class="contact-form__field">
                <label for="contact-name" class="contact-form__label">Reason</label>
                <input type="text" id="reason-name" name="contact-name" class="contact-form__input" maxlength="100" required>
            </div>

            <div class="contact-form__field">
                <label for="contact-comment" class="contact-form__label">Comment</label>
                <textarea id="contact-comment" name="contact-comment" class="contact-form__input contact-form__textarea" maxlength="500" required></textarea>
            </div>

            <button type="submit" class="contact-form__button">Send message</button>
        </form>
    </main>

    <footer class="main-footer">
        <div class="footer-top">
            <img class="footer-logo__img" src="../images/logo/Nova-Games-logo.png" alt="Nova Games logo">
        </div>
        <div class="footer-media">
            <nav class="footer-nav__bar">
                <ul class="footer-nav__list">
                    <li class="footer-list__element"><a href="#">help and feedback</a></li>
                    <li class="footer-list__element"><a href="#">terms of use</a></li>
                    <li class="footer-list__element"><a href="#">privacity and cookies</a></li>
                </ul>
            </nav>
        </div>
        <div class="footer-bottom">
            <p>all rights reserved to @anonimous - 2026</p>
        </div>
    </footer>
</body>
</html>
